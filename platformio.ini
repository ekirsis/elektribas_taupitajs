[platformio]
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
upload_port = /dev/ttyACM0
extra_scripts = 
    pre:scripts/trim_u8g2_fonts.py
    pre:scripts/build_webui.py
check_tool = clangtidy
check_flags = clangtidy: --config-file=.clang-tidy
    -extra-arg=-I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/cores/esp32
    -extra-arg=-I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/variants/arduino_nano_nora
check_skip_packages = true
lib_deps =
    olikraus/U8g2 @ ^2.35.30
    bblanchon/ArduinoJson @ ^7.3.0
    boseji/PString-Arduino-lib @ ^3.0.2

[env:native_test]
platform = native
test_framework = doctest
test_build_src = false
build_flags =
    -Itest
    -Isrc
    -Iinclude
    -I.pio/libdeps/arduino_nano_esp32/ArduinoJson/src
    -std=c++17
check_flags = cppcheck: --suppress=useStlAlgorithm --suppress=preprocessorErrorDirective --suppress=unusedFunction
lib_deps =
    olikraus/U8g2 @ ^2.35.30
    bblanchon/ArduinoJson @ ^7.3.0
